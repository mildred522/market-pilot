name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run regression suite
        working-directory: backend
        run: python -m pytest -q

  agent-safety-eval:
    name: Agent safety eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run deterministic Agent gate
        working-directory: backend
        run: |
          python -m scripts.run_agent_evals
          python -m scripts.evaluate_workflow_disclosure --output ../outputs/evals/workflow-disclosure.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: |
            outputs/evals/agent-eval-baseline.*
            outputs/evals/workflow-disclosure.json
          if-no-files-found: error
          retention-days: 14

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  launcher-build:
    name: Windows launcher build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build launcher
        run: dotnet build launcher/MarketPilot.Launcher/MarketPilot.Launcher.csproj --configuration Release
